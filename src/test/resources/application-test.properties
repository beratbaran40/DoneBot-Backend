# Test profile (activated by @ActiveProfiles("test")). Overrides application.properties.

# In-memory H2 so integration tests start from a clean schema each run and never touch the
# dev file DB (jdbc:h2:file:./data/tododb). Same H2 flavor as dev (no MODE override) so the
# Flyway h2 migrations apply identically.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway (classpath:db/migration/h2) builds the schema; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# The auth rate limiter is keyed on client IP, and MockMvc reuses 127.0.0.1 for every request,
# so register/login calls across test methods would trip the 15/min dev limit. Keep it effectively
# unlimited in tests.
app.auth.rate-limit.per-minute=100000
app.auth.rate-limit.per-day=100000
