# Production profile (active when SPRING_PROFILES_ACTIVE=prod)
# All secrets/connection strings come from environment variables; never commit values here.

server.port=${PORT:8080}

# Postgres (Render or Neon connection string)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway: never allow clean on prod
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
# First Flyway run on prod: existing Postgres schema was built by ddl-auto=update and is
# functionally at V3 (users/tasks/groups + notifications + password_reset already present).
# Skip V1..V3 and only apply V4 (invitations) and V5 (scheduling+preferences) onward.
# Safe to leave in place; once flyway_schema_history exists these settings are no-ops.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

# Disable H2 console in prod
spring.h2.console.enabled=false

# Actuator: only health endpoint exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=3600
app.jwt.refresh-token-ttl-seconds=2592000

# OAuth providers
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}
app.oauth.facebook.app-id=${APP_OAUTH_FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${APP_OAUTH_FACEBOOK_APP_SECRET:}

# Firebase (mount service-account JSON via Render secret file, then point env at the path)
app.firebase.service-account-path=${APP_FIREBASE_SERVICE_ACCOUNT_PATH:}
