# Production profile (active when SPRING_PROFILES_ACTIVE=prod)
# All secrets/connection strings come from environment variables; never commit values here.

server.port=${PORT:8080}

# Behind Render's TLS-terminating proxy: trust X-Forwarded-* so Spring sees the real https
# scheme/host. Fixes redirect URLs (RedirectView, OAuth, password-reset) and lets Spring Security
# emit HSTS, which it only does on requests it considers secure.
server.forward-headers-strategy=framework

# --- Graceful shutdown ---
# Render sends SIGTERM on every deploy. Spring's default IMMEDIATE shutdown cuts in-flight requests
# — especially the synchronous Vertex chat loop — so users hit 502 / half responses on each deploy.
# Drain in-flight requests first; keep the timeout under Render's SIGTERM→SIGKILL window (~30s).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Production logging ---
# SECURITY: the base application.properties turns on verbose request logging for dev
# (DispatcherServlet=DEBUG + spring.mvc.log-request-details=true). In prod that writes the
# Authorization: Bearer <JWT> header and login/register request bodies (email + password)
# straight into Render's log stream — anyone with log access reads live credentials. Force
# both off so secrets/PII never reach the logs.
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
spring.mvc.log-request-details=false

# Quiet framework noise to WARN, but keep our own operational logs at INFO so launch-eve
# checks (TaskDueSoonJob: notified=...), chat-cost tracking (ChatUsage), the VertexAI boot
# line and the exception handler's server-side 500s stay visible. Flyway stays at INFO so
# schema migrations remain traceable on every deploy.
logging.level.root=WARN
logging.level.com.todoapp.backend=INFO
logging.level.org.flywaydb=INFO

# Postgres (Render or Neon connection string)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP — release idle connections fast so Neon compute can scale to zero.
# Spring Boot default keeps `maximum-pool-size` (=10) connections always open, which prevents
# Neon from suspending and burns compute hours 24/7 even with zero real traffic.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=10000

# Flyway: never allow clean on prod
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
# First Flyway run on prod: existing Postgres schema was built by ddl-auto=update and only
# has the V1-era tables (users, tasks, family_groups, group_members, group_activities,
# task_photos, refresh_tokens, device_tokens). notifications/password_reset/invitations/
# user_preferences entities were added later but never deployed before Flyway adoption.
# Skip V1 and let Flyway apply V2..V5 to bring the schema up to date.
# Safe to leave in place; once flyway_schema_history exists these settings are no-ops.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Disable H2 console in prod
spring.h2.console.enabled=false

# Actuator: only health endpoint exposed.
# Expose probe sub-paths so Render can hit /actuator/health/liveness (JVM-only, no DB hit)
# instead of /actuator/health (which pings DB on every probe = constant Neon wake-up).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# MAIL_HOST is blank in prod env (mail dispatch is intentionally a no-op);
# the Spring mail health indicator reports DOWN otherwise, which makes
# /actuator/health return 503 even though chat + API are healthy.
management.health.mail.enabled=false

# Swagger / OpenAPI — DISABLED in prod so the full API schema isn't browsable from the public
# Render URL. With these off, springdoc registers neither /v3/api-docs nor /swagger-ui/** (both
# return 404). RootRedirectController sends "/" to the privacy page in prod instead of Swagger UI.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=3600
app.jwt.refresh-token-ttl-seconds=2592000

# OAuth providers
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}

# Firebase (mount service-account JSON via Render secret file, then point env at the path)
app.firebase.service-account-path=${APP_FIREBASE_SERVICE_ACCOUNT_PATH:}

# Password-reset email → HTTPS landing page (PasswordResetPageController). Email clients won't
# linkify the todoapp:// deep link, so the button must point at an https URL on this host; the
# page then relaunches the app. Override PASSWORD_RESET_WEB_LINK if the public domain differs.
app.password-reset.web-link=${PASSWORD_RESET_WEB_LINK:https://donebot-backend.onrender.com/reset-password}
