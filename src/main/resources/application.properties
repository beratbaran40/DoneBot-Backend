spring.application.name=todo-backend
server.port=8080

# H2 in-memory DB (dev only; switch to Postgres for prod via SPRING_DATASOURCE_URL)
spring.datasource.url=jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT (override JWT_SECRET in env for prod; this is dev default)
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-must-be-long-enough-for-hs256-algorithm-min-32-bytes}
app.jwt.access-token-ttl-seconds=3600
app.jwt.refresh-token-ttl-seconds=2592000

# OAuth providers (blank = endpoint returns 401 Invalid token; set in env to enable)
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}
app.oauth.facebook.app-id=${APP_OAUTH_FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${APP_OAUTH_FACEBOOK_APP_SECRET:}

# Firebase Admin (blank = push sending no-op; set in env to enable)
app.firebase.service-account-path=${APP_FIREBASE_SERVICE_ACCOUNT_PATH:}
