spring.application.name=todo-backend
server.port=8080

# Log every HTTP request (dev only)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
spring.mvc.log-request-details=true

# Correlation id (§4.17): append the per-request id (CorrelationIdFilter puts it in the MDC) after
# the log level so every line of one request is greppable. Empty for non-request logs (startup/jobs).
logging.pattern.level=%5p [%X{requestId:-}]

# Multipart upload limits (used for avatars / task photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# H2 file-based DB (dev only; survives backend restarts)
spring.datasource.url=jdbc:h2:file:./data/tododb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway (schema migrations). Vendor folder is auto-resolved: h2 or postgresql.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT (override JWT_SECRET in env for prod; this is dev default)
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-must-be-long-enough-for-hs256-algorithm-min-32-bytes}
app.jwt.access-token-ttl-seconds=3600
app.jwt.refresh-token-ttl-seconds=2592000

# Admin panel (/admin/**). Reaching it requires ALL THREE of: users.role = ADMIN, users.status =
# ACTIVE, and the account's email listed here. The allowlist is the gate that a compromised or
# mis-migrated database column cannot bypass on its own.
#
# FAIL-CLOSED: blank denies everyone. Never "if empty then allow" — forgetting the env var must lock
# you out of the panel, not open it to every registered user. Set ADMIN_ALLOWED_EMAILS on Render.
app.admin.allowed-emails=${ADMIN_ALLOWED_EMAILS:}

# Browser origins allowed to call the admin endpoints and the three auth endpoints the panel uses.
# Exact origins, comma-separated — no wildcards. Default is the Vite dev server; set
# ADMIN_CORS_ORIGINS on Render to the deployed panel URL. Vercel preview deployments get a fresh
# origin per commit and will not work against prod; that is deliberate.
app.admin.cors.allowed-origins=${ADMIN_CORS_ORIGINS:http://localhost:5173}

# Activity tracking feeds DAU/WAU/MAU and retention. At most one row per user per day; writes happen on
# a background thread and are dropped rather than queued if they ever back up.
app.metrics.activity.enabled=${APP_METRICS_ACTIVITY_ENABLED:true}
app.metrics.overview-cache-seconds=${APP_METRICS_OVERVIEW_CACHE_SECONDS:60}

# Auth endpoint rate limiting, per client IP (see AuthRateLimiter). Guards login/register/
# forgot-/reset-password against credential-stuffing and email-spam bursts. These are the
# defaults baked into AuthRateLimiter; surfaced here so they're tunable per environment.
app.auth.rate-limit.per-minute=15
app.auth.rate-limit.per-day=200

# OAuth providers (blank = endpoint returns 401 Invalid token; set in env to enable)
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}

# Firebase Admin (blank = push sending no-op; set in env to enable)
app.firebase.service-account-path=${APP_FIREBASE_SERVICE_ACCOUNT_PATH:}

# Mail (blank host = mail sending no-op / logs only). For real delivery, set these on Render:
#   MAIL_HOST=smtp.gmail.com  MAIL_PORT=587  MAIL_USERNAME=donebotapp@gmail.com
#   MAIL_PASSWORD=<Gmail App Password (requires 2FA on the account)>  MAIL_FROM=donebotapp@gmail.com
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password reset
app.mail.from=${MAIL_FROM:donebotapp@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:DoneBot}
# Absolute base URL for images embedded in emails (logo/avatar). Must be publicly reachable.
app.mail.asset-base-url=${MAIL_ASSET_BASE_URL:https://donebot-backend.onrender.com}
app.password-reset.deep-link=${PASSWORD_RESET_DEEP_LINK:todoapp://reset-password}
# HTTPS landing page the reset email button points at (email clients won't linkify todoapp://).
# Blank here so dev/local keeps logging the raw deep link; prod sets a real https URL.
app.password-reset.web-link=${PASSWORD_RESET_WEB_LINK:}
app.password-reset.ttl-minutes=30

# Vertex AI (DoneBot chat proxy). When project-id is blank the chat endpoint
# returns 503 Service Unavailable so the rest of the API still boots locally.
# In prod (Render) set GCP_PROJECT_ID + GOOGLE_APPLICATION_CREDENTIALS_JSON.
app.vertex.project-id=${GCP_PROJECT_ID:}
app.vertex.location=${GCP_VERTEX_LOCATION:us-central1}
app.vertex.model=${GCP_VERTEX_MODEL:gemini-2.5-flash}
app.vertex.max-tool-iterations=5
app.vertex.max-history-turns=10
app.vertex.temperature=0.2
app.vertex.max-output-tokens=1024
